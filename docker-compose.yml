name: mac-video-analyzer

services:
  analyzer:
    build: .
    image: mac-video-analyzer:local
    container_name: mac-video-analyzer
    restart: unless-stopped
    ports:
      - "31027:8000"
    environment:
      VISION_MODEL: moondream2
      MOONDREAM_REVISION: 2025-01-09
      AUDIO_MODEL: tiny
      SAMPLE_FPS: "1.0"
      MAX_FRAMES: "60"
      VISION_MAX_CROPS: "1"
      CAPTION_MAX_TOKENS: "48"
      OMP_NUM_THREADS: "4"
    volumes:
      - ./shared_volume:/data/shared
      - models-cache:/root/.cache/huggingface

volumes:
  models-cache: